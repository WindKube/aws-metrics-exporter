version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usetesting
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: package-comments
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - importShadow
        # Both flag "you copied a big struct". Every AWS SDK type is a big struct,
        # and passing them by pointer through the collector and storage interfaces
        # would buy aliasing bugs for a copy that is not on any hot path.
        - hugeParam
        - rangeValCopy

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests deliberately construct hostile input and ignore errors while doing it.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/windkube/aws-metrics-exporter
